<h1>short-collect</h1>
<p>short-collect is a personal tool used only by the owner of one YouTube channel. It reads that channel's own YouTube Analytics data (such as audience retention) so the owner can review how their videos perform.</p>
<p>It is not offered to the public. <a href="privacy.html">Privacy policy</a></p>
